<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gearBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF4FA"/>
      <stop offset="42%" stop-color="#9CB3C5"/>
      <stop offset="100%" stop-color="#4F6D82"/>
    </linearGradient>
    <linearGradient id="gearRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7E6F0"/>
      <stop offset="100%" stop-color="#67859B"/>
    </linearGradient>
    <linearGradient id="brassHub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF28A"/>
      <stop offset="50%" stop-color="#F2B338"/>
      <stop offset="100%" stop-color="#BA6B16"/>
    </linearGradient>
    <linearGradient id="innerBore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141E26"/>
      <stop offset="100%" stop-color="#243440"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#121D24" flood-opacity=".48"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Outer Heavy Outline -->
    <path d="M 214.4 75.7 A 185 185 0 0 1 297.6 75.7 L 291.2 124.6 A 136 136 0 0 1 352.2 159.8 L 391.3 129.8 A 185 185 0 0 1 432.9 201.9 L 387.4 220.8 A 136 136 0 0 1 387.4 291.2 L 432.9 310.1 A 185 185 0 0 1 391.3 382.2 L 352.2 352.2 A 136 136 0 0 1 291.2 387.4 L 297.6 436.3 A 185 185 0 0 1 214.4 436.3 L 220.8 387.4 A 136 136 0 0 1 159.8 352.2 L 120.7 382.2 A 185 185 0 0 1 79.1 310.1 L 124.6 291.2 A 136 136 0 0 1 124.6 220.8 L 79.1 201.9 A 185 185 0 0 1 120.7 129.8 L 159.8 159.8 A 136 136 0 0 1 220.8 124.6 Z" fill="#FFF1D0" stroke="#15202B" stroke-width="36"/>
    <!-- Inner Cream Separation Line & Main Fill -->
    <path d="M 214.4 75.7 A 185 185 0 0 1 297.6 75.7 L 291.2 124.6 A 136 136 0 0 1 352.2 159.8 L 391.3 129.8 A 185 185 0 0 1 432.9 201.9 L 387.4 220.8 A 136 136 0 0 1 387.4 291.2 L 432.9 310.1 A 185 185 0 0 1 391.3 382.2 L 352.2 352.2 A 136 136 0 0 1 291.2 387.4 L 297.6 436.3 A 185 185 0 0 1 214.4 436.3 L 220.8 387.4 A 136 136 0 0 1 159.8 352.2 L 120.7 382.2 A 185 185 0 0 1 79.1 310.1 L 124.6 291.2 A 136 136 0 0 1 124.6 220.8 L 79.1 201.9 A 185 185 0 0 1 120.7 129.8 L 159.8 159.8 A 136 136 0 0 1 220.8 124.6 Z" fill="url(#gearBody)" stroke="#FFF1D0" stroke-width="15"/>

    <!-- Concentric Gear Ring Recess -->
    <circle cx="256" cy="256" r="116" fill="none" stroke="#3D5668" stroke-width="16" opacity=".55"/>
    <circle cx="256" cy="256" r="116" fill="none" stroke="#FFFFFF" stroke-width="4" opacity=".65"/>

    <!-- Golden Brass Hub -->
    <circle cx="256" cy="256" r="82" fill="url(#brassHub)" stroke="#15202B" stroke-width="18"/>
    <circle cx="256" cy="256" r="82" fill="none" stroke="#FFF5DA" stroke-width="8" opacity=".9"/>

    <!-- Center Bore Hole (Axle Aperture) -->
    <circle cx="256" cy="256" r="42" fill="url(#innerBore)" stroke="#15202B" stroke-width="15"/>
    <circle cx="256" cy="256" r="35" fill="none" stroke="#FFF1D0" stroke-width="5" opacity=".6"/>

    <!-- 6 Mechanical Hub Bolts / Rivets -->
    <circle cx="256" cy="194" r="8" fill="#FFF1D0" stroke="#15202B" stroke-width="5"/>
    <circle cx="310" cy="225" r="8" fill="#FFF1D0" stroke="#15202B" stroke-width="5"/>
    <circle cx="310" cy="287" r="8" fill="#FFF1D0" stroke="#15202B" stroke-width="5"/>
    <circle cx="256" cy="318" r="8" fill="#FFF1D0" stroke="#15202B" stroke-width="5"/>
    <circle cx="202" cy="287" r="8" fill="#FFF1D0" stroke="#15202B" stroke-width="5"/>
    <circle cx="202" cy="225" r="8" fill="#FFF1D0" stroke="#15202B" stroke-width="5"/>

    <!-- Top-Left Specular Highlights -->
    <path d="M 230 76 A 185 185 0 0 1 282 76" fill="none" stroke="#FFFFFF" stroke-width="10" opacity=".85"/>
    <path d="M 125 152 A 185 185 0 0 1 162 115" fill="none" stroke="#FFFFFF" stroke-width="9" opacity=".75"/>
    <path d="M 86 240 A 185 185 0 0 1 96 200" fill="none" stroke="#FFFFFF" stroke-width="9" opacity=".75"/>
    <path d="M 200 215 A 64 64 0 0 1 256 194" fill="none" stroke="#FFFFFF" stroke-width="7" opacity=".8"/>
  </g>
</svg>
