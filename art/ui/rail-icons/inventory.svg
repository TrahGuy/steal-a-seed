  <!-- Fills knocked out at the owner's direction: the planter/satchel body is
       transparent so the rail button's own colour shows through, leaving the dark
       keyline, the cream separation stroke and the coloured accents.

       THE DROP SHADOW WENT WITH THEM. feDropShadow paints behind the element, so
       with a transparent interior it showed THROUGH the icon and put a dark smudge
       across the very area that is meant to be reading as button colour. shop.svg
       and index.svg keep theirs: their bodies are still solid, so their shadow is
       still behind something. -->
